<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Bot</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run/@google/generative-ai"
        }
      }
    </script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fa-solid fa-robot"></i>
                <span>Gemini Bot</span>
            </div>
            <button id="new-chat-btn" class="btn-primary">
                <i class="fa-solid fa-plus"></i> New Chat
            </button>
            <div class="history-list" id="history-list">
                <!-- Chat history items will be added here -->
            </div>
            <div class="sidebar-footer">
                <button id="settings-btn" class="btn-icon">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area">
            <div class="chat-header">
                <button id="mobile-menu-btn" class="mobile-only">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <span id="current-model-name">Gemini 1.5 Flash</span>
            </div>

            <div class="messages-container" id="messages-container">
                <div class="welcome-message">
                    <h1>How can I help you today?</h1>
                    <p>I can generate text, analyze images, and assist with code.</p>
                </div>
            </div>

            <div class="input-area">
                <div class="input-container">
                    <div id="image-preview" class="image-preview hidden">
                        <div id="preview-content"></div>
                        <button id="remove-image"><i class="fa-solid fa-times"></i></button>
                    </div>
                    <textarea id="prompt-input" placeholder="Message Gemini..." rows="1"></textarea>
                    <div class="input-actions">
                        <input type="file" id="file-upload" accept="image/*,video/*,audio/*" hidden>
                        <button id="upload-btn" class="btn-icon-small" title="Upload File">
                            <i class="fa-solid fa-paperclip"></i>
                        </button>
                        <button id="send-btn" class="btn-icon-small" disabled>
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
                <p class="disclaimer">Gemini may display inaccurate info, including about people, so double-check its responses.</p>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button id="close-modal" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="api-key">Google AI API Key</label>
                    <input type="password" id="api-key" placeholder="Enter your API Key">
                    <p class="help-text">Get your key from <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a></p>
                </div>
                <div class="form-group">
                    <label for="model-select">Model</label>
                    <select id="model-select">
                        <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                        <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button id="save-settings" class="btn-primary">Save</button>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
